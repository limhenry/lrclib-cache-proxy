services:
  lrclib-cache-proxy:
    build: .
    container_name: lrclib-cache-proxy
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      - DB_PATH=/data/lyrics.db
      - LRCLIB_BASE_URL=https://lrclib.net
      - NOT_FOUND_TTL_DAYS=7
      - ALLOWED_ORIGINS=
    volumes:
      - lrclib-cache-proxy-data:/data

volumes:
  lrclib-cache-proxy-data:
